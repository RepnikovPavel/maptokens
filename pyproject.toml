[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maptokens"
version = "0.1.0"
description = "Selective driving dataset downloads and a GPU browser explorer"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "numpy>=1.26,<3", "Pillow>=11,<13", "pyproj>=3.6,<4", "huggingface-hub>=0.36,<2"]

[project.scripts]
kitscenes = "maptokens.kitscenes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"maptokens.kitscenes" = ["web/*"]
